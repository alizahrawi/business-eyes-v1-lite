  <path class="flow" d="M1760 1695 H1800"/>
  <path class="flow" d="M1860 1745 V1840 H1990"/>
  <text class="flow-label" x="1882" y="1782">Yes</text>
  <path class="flow" d="M2225 1840 H2250 V1695 H2280"/>
