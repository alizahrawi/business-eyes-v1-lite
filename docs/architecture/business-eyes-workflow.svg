  <path class="flow" d="M2755 1555 H2780 V1835 H2800"/>
  <path class="flow" d="M2920 1835 H2990"/>
  <text class="flow-label" x="2935" y="1818">Yes</text>
  <path class="flow" d="M3225 1835 H3250 V1695 H3280"/>
  <path class="flow-muted" d="M1860 1645 V1500 H875 V1520"/>
  <text class="flow-no" x="1640" y="1490">No → retry or cancel</text>
  <path class="flow-muted" d="M2860 1885 V2025 H612 V1730"/>
  <text class="flow-no" x="2670" y="2012">No → top up again</text>

  <!-- Legend -->
  <circle class="event" cx="90" cy="2167" r="18"/>
  <text class="legend" x="120" y="2174">Event</text>
  <rect class="task" x="245" y="2145" width="65" height="42" rx="10"/>
  <text class="legend" x="325" y="2174">Task</text>
  <polygon class="gateway" points="445,2145 470,2166 445,2187 420,2166"/>
